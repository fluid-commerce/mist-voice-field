<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: transparent; color: #f4f1fa; font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
        #root .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(7,6,11,0) 50%, rgba(7,6,11,0.55) 100%); }
        #root .lock { position: absolute; left: 0; right: 0; top: 1160px; text-align: center; }
        #root .word { margin: 0; font-weight: 900; font-size: 176px; line-height: 1; letter-spacing: -0.03em; display: flex; justify-content: center; gap: 2px; }
        #root .word span { display: inline-block; }
        #root .by { margin: 22px 0 0; font: 700 26px/1 "JetBrains Mono", monospace; letter-spacing: 0.22em; text-transform: uppercase; color: #9a93a8; }
        #root .ask { margin: 70px 0 0; font-weight: 600; font-size: 54px; letter-spacing: -0.02em; color: #ff6fd8; }
        #root .rule { width: 160px; height: 4px; background: #a855f7; margin: 40px auto 0; transform-origin: center; }
      </style>
      <div data-hf-id="hf-ut9d" id="root" data-composition-id="lockup" data-width="1080" data-height="1920">
        <div data-hf-id="hf-e4a6" class="vig"></div>
        <div data-hf-id="hf-fhcd" class="lock">
          <p data-hf-id="hf-bw0d" class="word" id="word"><span data-hf-id="hf-i0hw">M</span><span data-hf-id="hf-jlq0">I</span><span data-hf-id="hf-fmnq">S</span><span data-hf-id="hf-efqn">T</span></p>
          <p data-hf-id="hf-4ap8" class="by" id="by">by Fluid</p>
          <div data-hf-id="hf-u4he" class="rule" id="rule"></div>
          <p data-hf-id="hf-vu69" class="ask" id="ask">Ask it anything.</p>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // the wordmark comes to exist letter by letter under the M already on the wall
          tl.from("#word span", { autoAlpha: 0, y: 70, duration: 0.7, ease: "expo.out", stagger: 0.09 }, 0.5);
          tl.from("#by", { autoAlpha: 0, y: 18, duration: 0.5, ease: "power3.out" }, 1.3);
          tl.from("#rule", { scaleX: 0, duration: 0.6, ease: "expo.out" }, 1.7);
          tl.from("#ask", { autoAlpha: 0, y: 24, duration: 0.7, ease: "back.out(1.6)" }, 2.4);
          window.__timelines["lockup"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
