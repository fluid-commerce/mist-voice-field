<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: transparent; color: #f4f1fa; font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
        #root .label { position: absolute; left: 90px; top: 830px; font: 700 24px/1 "JetBrains Mono", monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #a855f7; }
        #root .panel { position: absolute; left: 90px; right: 90px; top: 880px; background: rgba(10,9,16,0.72); border: 2px solid #23202e; border-radius: 18px; padding: 44px 48px; }
        #root .row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 22px; padding: 22px 0; border-top: 2px solid #1b1824; }
        #root .row:first-child { border-top: 0; padding-top: 0; }
        #root .row .dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #ff6fd8; box-sizing: border-box; }
        #root .row .dot.done { background: #ff6fd8; }
        #root .row .t { font-weight: 600; font-size: 36px; letter-spacing: -0.01em; }
        #root .row .s { font: 700 22px/1 "JetBrains Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #9a93a8; min-width: 110px; text-align: right; }
        #root .row .s.done { color: #f4f1fa; }
      </style>
      <div data-hf-id="hf-gt1j" id="root" data-composition-id="thinking" data-width="1080" data-height="1920">
        <div data-hf-id="hf-w78y" class="label" id="label">thinking</div>
        <div data-hf-id="hf-e1ia" class="panel" id="panel">
          <div data-hf-id="hf-ilt9" class="row" id="r1"><span data-hf-id="hf-ruyp" class="dot" id="d1"></span><span data-hf-id="hf-dv1n" class="t">Querying your database</span><span data-hf-id="hf-hbid" class="s" id="s1">working</span></div>
          <div data-hf-id="hf-mjxa" class="row" id="r2"><span data-hf-id="hf-vt2q" class="dot" id="d2"></span><span data-hf-id="hf-dncp" class="t">Checking your store data</span><span data-hf-id="hf-x4og" class="s" id="s2">working</span></div>
          <div data-hf-id="hf-qi1b" class="row" id="r3"><span data-hf-id="hf-1ysj" class="dot" id="d3"></span><span data-hf-id="hf-m9v5" class="t">Summarising the change log</span><span data-hf-id="hf-41un" class="s" id="s3">working</span></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.from("#label", { autoAlpha: 0, x: -20, duration: 0.5, ease: "power3.out" }, 0.2);
          tl.from("#panel", { autoAlpha: 0, y: 40, scale: 0.98, duration: 0.7, ease: "expo.out" }, 0.5);
          // rows arrive one at a time; each spins, then flips to done
          [["#r1", "#d1", "#s1", 1.1, 3.0], ["#r2", "#d2", "#s2", 2.1, 4.3], ["#r3", "#d3", "#s3", 3.1, 5.6]].forEach(([r, d, s, tIn, tDone]) => {
            tl.from(r, { autoAlpha: 0, x: 30, duration: 0.5, ease: "power3.out" }, tIn);
            const spins = Math.max(0, Math.floor((tDone - tIn) / 0.6) - 1);
            tl.to(d, { rotation: 360, duration: 0.6, ease: "none", repeat: spins }, tIn);
            tl.to(d, { scale: 1.35, duration: 0.22, ease: "back.out(3)" }, tDone);
            tl.to(d, { scale: 1, duration: 0.25, ease: "power2.out" }, tDone + 0.22);
            tl.set(d, { className: "dot done" }, tDone);
            tl.set(s, { textContent: "done", className: "s done" }, tDone);
          });
          window.__timelines["thinking"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
